<svg width="640" height="290" viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Developer workspace illustration">
  <defs>
    <radialGradient id="g"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <clipPath id="screen"><rect x="120" y="20" width="400" height="220" rx="16"/></clipPath>
  </defs>

  <circle cx="320" cy="140" r="170" fill="url(#g)"/>

  <!-- monitor -->
  <rect x="120" y="20" width="400" height="220" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="120" y="20" width="400" height="32" fill="#161b22"/>
    <circle cx="142" cy="36" r="5" fill="#ff5f57"/>
    <circle cx="160" cy="36" r="5" fill="#febc2e"/>
    <circle cx="178" cy="36" r="5" fill="#28c840"/>

    <rect x="144" y="72"  width="110" height="8" rx="4" fill="#a78bfa"><animate attributeName="width" values="0;110;110;0" keyTimes="0;0.3;0.9;1" dur="6s" begin="0s"   repeatCount="indefinite"/></rect>
    <rect x="168" y="96"  width="200" height="8" rx="4" fill="#38bdf8"><animate attributeName="width" values="0;200;200;0" keyTimes="0;0.3;0.9;1" dur="6s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="168" y="120" width="150" height="8" rx="4" fill="#22d3ee"><animate attributeName="width" values="0;150;150;0" keyTimes="0;0.3;0.9;1" dur="6s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="192" y="144" width="90"  height="8" rx="4" fill="#f472b6"><animate attributeName="width" values="0;90;90;0"   keyTimes="0;0.3;0.9;1" dur="6s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="168" y="168" width="180" height="8" rx="4" fill="#facc15"><animate attributeName="width" values="0;180;180;0" keyTimes="0;0.3;0.9;1" dur="6s" begin="1.6s" repeatCount="indefinite"/></rect>
    <rect x="144" y="192" width="70"  height="8" rx="4" fill="#a78bfa"><animate attributeName="width" values="0;70;70;0"   keyTimes="0;0.3;0.9;1" dur="6s" begin="2s"   repeatCount="indefinite"/></rect>
    <rect x="144" y="212" width="8" height="14" fill="#38bdf8"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- stand -->
  <path d="M292 240H348L358 262H282Z" fill="#1f2937"/>
  <rect x="250" y="262" width="140" height="8" rx="4" fill="#334155"/>

  <!-- floating React card -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="4s" repeatCount="indefinite"/>
    <rect x="470" y="55" width="110" height="110" rx="20" fill="#0f172a" fill-opacity="0.92" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 525 110" to="360 525 110" dur="14s" repeatCount="indefinite"/>
      <ellipse cx="525" cy="110" rx="38" ry="14" fill="none" stroke="#61dafb" stroke-width="3"/>
      <ellipse cx="525" cy="110" rx="38" ry="14" fill="none" stroke="#61dafb" stroke-width="3" transform="rotate(60 525 110)"/>
      <ellipse cx="525" cy="110" rx="38" ry="14" fill="none" stroke="#61dafb" stroke-width="3" transform="rotate(120 525 110)"/>
    </g>
    <circle cx="525" cy="110" r="5.5" fill="#61dafb"/>
  </g>

  <!-- floating TS card -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="5s" repeatCount="indefinite"/>
    <rect x="42" y="105" width="86" height="86" rx="18" fill="#3178c6"/>
    <text x="85" y="161" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="#ffffff">TS</text>
  </g>

  <!-- floating JS card -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="4.5s" repeatCount="indefinite"/>
    <rect x="505" y="188" width="72" height="72" rx="16" fill="#f7df1e"/>
    <text x="541" y="237" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="800" fill="#111111">JS</text>
  </g>
</svg>
