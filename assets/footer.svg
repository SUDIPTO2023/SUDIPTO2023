<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thanks for visiting">
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="c"><rect width="1000" height="220"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1000" height="220" fill="#0b1020"/>

    <!-- back wave -->
    <path d="M0 120 Q125 80 250 120 T500 120 T750 120 T1000 120 T1250 120 T1500 120 T1750 120 T2000 120 V220 H0 Z" fill="url(#w2)" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <!-- front wave -->
    <path d="M0 140 Q125 100 250 140 T500 140 T750 140 T1000 140 T1250 140 T1500 140 T1750 140 T2000 140 V220 H0 Z" fill="url(#w1)" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- closing message -->
    <text x="500" y="62" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="url(#t)">Thanks for visiting my profile</text>
    <text x="500" y="92" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#94a3b8">Let's build something great together.</text>

    <!-- subtle pulsing dots -->
    <circle cx="470" cy="108" r="3" fill="#a78bfa"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="108" r="3" fill="#38bdf8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="108" r="3" fill="#22d3ee"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
