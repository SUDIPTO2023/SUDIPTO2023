<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thanks for visiting - Sudipto Kumar Chakrabarty">
  <defs>
    <linearGradient id="bgf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#0d1030"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c1d95"/><stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="tf" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.4" stop-color="#38bdf8"/>
      <stop offset="0.75" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="500 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="gl" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cf"><rect width="1000" height="260"/></clipPath>
  </defs>

  <g clip-path="url(#cf)">
    <rect width="1000" height="260" fill="url(#bgf)"/>

    <!-- rising particles -->
    <g fill="#ffffff">
      <circle cx="90"  cy="200" r="2"   opacity="0"><animate attributeName="cy" values="230;40" dur="9s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s"  repeatCount="indefinite"/></circle>
      <circle cx="230" cy="210" r="1.5" opacity="0"><animate attributeName="cy" values="240;50" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="205" r="2.5" opacity="0"><animate attributeName="cy" values="235;30" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="210" r="2"   opacity="0"><animate attributeName="cy" values="240;40" dur="8s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8s"  repeatCount="indefinite"/></circle>
      <circle cx="770" cy="205" r="1.5" opacity="0"><animate attributeName="cy" values="235;50" dur="13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="13s" repeatCount="indefinite"/></circle>
      <circle cx="910" cy="210" r="2.5" opacity="0"><animate attributeName="cy" values="240;30" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" repeatCount="indefinite"/></circle>
    </g>

    <!-- floating code symbols -->
    <g font-family="'Fira Code','SFMono-Regular',Consolas,monospace" font-size="38" font-weight="700">
      <text x="120" y="110" fill="#38bdf8" opacity="0.25">&lt;/&gt;<animate attributeName="y" values="110;98;110" dur="5s" repeatCount="indefinite"/></text>
      <text x="830" y="110" fill="#a78bfa" opacity="0.25">{ }<animate attributeName="y" values="98;110;98" dur="6s" repeatCount="indefinite"/></text>
    </g>

    <!-- message -->
    <text x="500" y="70" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="url(#tf)" filter="url(#gl)">Thanks for visiting</text>
    <text x="500" y="104" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#cbd5e1">Sudipto Kumar Chakrabarty  ·  Frontend-Focused Developer</text>
    <text x="500" y="130" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#94a3b8">Let's build something great together.</text>

    <!-- pulsing dots -->
    <circle cx="470" cy="148" r="3" fill="#a78bfa"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="148" r="3" fill="#38bdf8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="148" r="3" fill="#22d3ee"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>

    <!-- waves -->
    <path d="M0 175 Q125 150 250 175 T500 175 T750 175 T1000 175 T1250 175 T1500 175 T1750 175 T2000 175 V260 H0 Z" fill="url(#w2)" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M0 192 Q125 168 250 192 T500 192 T750 192 T1000 192 T1250 192 T1500 192 T1750 192 T2000 192 V260 H0 Z" fill="url(#w1)" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 210 Q125 190 250 210 T500 210 T750 210 T1000 210 T1250 210 T1500 210 T1750 210 T2000 210 V260 H0 Z" fill="url(#w3)" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="7s" repeatCount="indefinite"/>
    </path>

    <text x="500" y="244" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#e2e8f0" opacity="0.8" letter-spacing="2">DESIGNED &amp; BUILT WITH CARE  ·  SUDIPTO2023</text>
  </g>
</svg>
