<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Sudipto Kumar Chakrabarty</title>
  <desc id="desc">Frontend-focused software developer portfolio banner with a dark navy background and violet-blue gradients.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#11172B"/>
      <stop offset="1" stop-color="#17132D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="70%">
      <stop offset="0" stop-color="#6D5AE6" stop-opacity=".30"/>
      <stop offset="1" stop-color="#6D5AE6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#A5B4FC" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="350" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="350" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="350" rx="24" fill="url(#glow)"/>
  <ellipse cx="1030" cy="82" rx="170" ry="105" fill="#6D5AE6" opacity=".18" filter="url(#soft)"/>
  <ellipse cx="850" cy="315" rx="180" ry="80" fill="#2563EB" opacity=".12" filter="url(#soft)"/>

  <path d="M0 292 C210 250 340 345 550 290 S900 245 1200 285" fill="none" stroke="url(#accent)" stroke-opacity=".22" stroke-width="2"/>
  <path d="M0 310 C230 270 380 360 600 305 S950 270 1200 310" fill="none" stroke="#A78BFA" stroke-opacity=".10" stroke-width="1"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="76" y="78" fill="#A5B4FC" font-size="15" font-weight="700" letter-spacing="4">DEVELOPER PORTFOLIO</text>
    <rect x="76" y="99" width="54" height="4" rx="2" fill="url(#accent)"/>
    <text x="76" y="164" fill="#F8FAFC" font-size="43" font-weight="750" letter-spacing="-1.4">SUDIPTO KUMAR</text>
    <text x="76" y="216" fill="url(#accent)" font-size="47" font-weight="800" letter-spacing="-1.8">CHAKRABARTY</text>
    <text x="78" y="258" fill="#C4CBD8" font-size="18" font-weight="500" letter-spacing=".5">Frontend-focused software developer</text>
    <text x="78" y="291" fill="#8B95A9" font-size="14" letter-spacing="1.2">REACT  /  NEXT.JS  /  JAVASCRIPT  /  TYPESCRIPT</text>
  </g>

  <g transform="translate(850 88)">
    <rect x="0" y="0" width="270" height="170" rx="16" fill="#0A0F1D" fill-opacity=".72" stroke="#9B8CFF" stroke-opacity=".38"/>
    <path d="M0 42H270" stroke="#667085" stroke-opacity=".35"/>
    <circle cx="22" cy="21" r="5" fill="#F87171"/>
    <circle cx="40" cy="21" r="5" fill="#FBBF24"/>
    <circle cx="58" cy="21" r="5" fill="#34D399"/>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="13">
      <text x="22" y="73" fill="#A78BFA">const</text>
      <text x="67" y="73" fill="#E2E8F0">developer = {</text>
      <text x="38" y="101" fill="#67E8F9">focus:</text>
      <text x="94" y="101" fill="#A7F3D0">"frontend",</text>
      <text x="38" y="129" fill="#67E8F9">stack:</text>
      <text x="94" y="129" fill="#A7F3D0">"React + Next.js"</text>
      <text x="22" y="153" fill="#E2E8F0">};</text>
    </g>
  </g>

  <circle cx="1125" cy="58" r="3" fill="#67E8F9"/>
  <circle cx="817" cy="285" r="4" fill="#A78BFA"/>
  <circle cx="780" cy="72" r="2" fill="#67E8F9" opacity=".8"/>
</svg>
