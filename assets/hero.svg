<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sudipto Kumar Chakrabarty - Frontend-Focused Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#14123a"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#0ea5e9" stop-opacity="0.5"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="360" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="360" fill="url(#bg)"/>
    <rect width="1000" height="360" fill="url(#grid)"/>

    <!-- floating glow orbs -->
    <circle cx="170" cy="90" r="190" fill="url(#orbA)">
      <animate attributeName="cx" values="170;260;170" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;140;90" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="270" r="210" fill="url(#orbB)">
      <animate attributeName="cx" values="850;760;850" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="270;210;270" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- floating particles -->
    <g fill="#ffffff">
      <circle cx="80"  cy="300" r="2"   opacity="0.5"><animate attributeName="cy" values="320;40" dur="9s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s"  repeatCount="indefinite"/></circle>
      <circle cx="190" cy="320" r="1.5" opacity="0.5"><animate attributeName="cy" values="340;60" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="310" r="2.5" opacity="0.5"><animate attributeName="cy" values="330;30" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="330" r="1.5" opacity="0.5"><animate attributeName="cy" values="350;50" dur="13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="13s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="320" r="2"   opacity="0.5"><animate attributeName="cy" values="340;40" dur="8s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8s"  repeatCount="indefinite"/></circle>
      <circle cx="700" cy="310" r="2.5" opacity="0.5"><animate attributeName="cy" values="330;30" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="330" r="1.5" opacity="0.5"><animate attributeName="cy" values="350;60" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="320" r="2"   opacity="0.5"><animate attributeName="cy" values="340;40" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="10s" repeatCount="indefinite"/></circle>
    </g>

    <!-- glass frame -->
    <rect x="12" y="12" width="976" height="336" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#a78bfa" stroke-opacity="0.35"/>

    <!-- code-style label -->
    <text x="500" y="78" text-anchor="middle" font-family="'Fira Code','SFMono-Regular',Consolas,monospace" font-size="16" fill="#22d3ee" letter-spacing="3">&lt;Hello World /&gt;  I AM</text>

    <!-- NAME -->
    <text x="500" y="155" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="800" fill="url(#txt)" filter="url(#glow)">Sudipto Kumar Chakrabarty</text>

    <!-- divider -->
    <rect x="400" y="180" width="200" height="3" rx="2" fill="url(#txt)"/>

    <!-- title -->
    <text x="500" y="222" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600" fill="#e2e8f0" letter-spacing="1">Frontend-Focused Software Developer</text>

    <text x="500" y="254" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#94a3b8">Building modern, responsive and user-friendly web experiences</text>

    <!-- tech chips -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      <rect x="236" y="285" width="120" height="34" rx="17" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="296" y="307" fill="#7dd3fc">React.js</text>
      <rect x="372" y="285" width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#e2e8f0" stroke-opacity="0.5"/>
      <text x="432" y="307" fill="#f1f5f9">Next.js</text>
      <rect x="508" y="285" width="120" height="34" rx="17" fill="#3b82f6" fill-opacity="0.14" stroke="#60a5fa" stroke-opacity="0.6"/>
      <text x="568" y="307" fill="#93c5fd">TypeScript</text>
      <rect x="644" y="285" width="120" height="34" rx="17" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.6"/>
      <text x="704" y="307" fill="#fde047">JavaScript</text>
    </g>
  </g>
</svg>
