<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sudipto Kumar Chakrabarty - Frontend-Focused Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.5" stop-color="#120f33"/>
      <stop offset="1" stop-color="#06182b"/>
    </linearGradient>
    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.35" stop-color="#38bdf8"/>
      <stop offset="0.7" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="500 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#0ea5e9" stop-opacity="0.5"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="400" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="400" fill="url(#bg)"/>
    <rect width="1000" height="400" fill="url(#grid)"/>

    <!-- aurora orbs -->
    <circle cx="160" cy="100" r="200" fill="url(#orbA)">
      <animate attributeName="cx" values="160;270;160" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;160;100" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="300" r="220" fill="url(#orbB)">
      <animate attributeName="cx" values="860;750;860" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;230;300" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- orbit rings -->
    <g transform="translate(500 215)">
      <circle r="178" fill="none" stroke="#a78bfa" stroke-opacity="0.2" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite"/>
      </circle>
      <circle r="136" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-dasharray="2 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
      </circle>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <circle cx="178" cy="0" r="4" fill="#a78bfa" filter="url(#glow)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="14s" repeatCount="indefinite"/>
        <circle cx="136" cy="0" r="3.5" fill="#22d3ee" filter="url(#glow)"/>
      </g>
    </g>

    <!-- floating particles -->
    <g fill="#ffffff">
      <circle cx="80"  cy="360" r="2"   opacity="0"><animate attributeName="cy" values="380;60" dur="9s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s"  repeatCount="indefinite"/></circle>
      <circle cx="190" cy="370" r="1.5" opacity="0"><animate attributeName="cy" values="390;80" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="365" r="2.5" opacity="0"><animate attributeName="cy" values="385;60" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="372" r="1.5" opacity="0"><animate attributeName="cy" values="392;90" dur="13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="13s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="368" r="2"   opacity="0"><animate attributeName="cy" values="388;70" dur="8s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8s"  repeatCount="indefinite"/></circle>
      <circle cx="680" cy="372" r="2.5" opacity="0"><animate attributeName="cy" values="392;60" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="366" r="1.5" opacity="0"><animate attributeName="cy" values="386;80" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="920" cy="370" r="2"   opacity="0"><animate attributeName="cy" values="390;60" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="10s" repeatCount="indefinite"/></circle>
    </g>

    <!-- floating code fragments -->
    <g font-family="'Fira Code','SFMono-Regular',Consolas,monospace" font-size="22" font-weight="600">
      <text x="70" y="150" fill="#38bdf8" opacity="0.28">&lt;App /&gt;<animate attributeName="y" values="150;138;150" dur="5s" repeatCount="indefinite"/></text>
      <text x="80" y="290" fill="#a78bfa" opacity="0.28">const ui</text>
      <text x="835" y="140" fill="#22d3ee" opacity="0.28">{ }<animate attributeName="y" values="140;152;140" dur="6s" repeatCount="indefinite"/></text>
      <text x="800" y="285" fill="#38bdf8" opacity="0.28">=&gt;</text>
    </g>

    <!-- glass frame -->
    <rect x="16" y="16" width="968" height="368" rx="20" fill="#ffffff" fill-opacity="0.035" stroke="url(#border)" stroke-width="1.5"/>
    <path d="M16 56 V36 A20 20 0 0 1 36 16 H964 A20 20 0 0 1 984 36 V56 Z" fill="#ffffff" fill-opacity="0.05"/>
    <line x1="16" y1="56" x2="984" y2="56" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="42" cy="36" r="6" fill="#ff5f57"/>
    <circle cx="62" cy="36" r="6" fill="#febc2e"/>
    <circle cx="82" cy="36" r="6" fill="#28c840"/>
    <text x="500" y="41" text-anchor="middle" font-family="'Fira Code','SFMono-Regular',Consolas,monospace" font-size="13" fill="#94a3b8">sudipto.portfolio.tsx</text>
    <text x="960" y="41" text-anchor="end" font-family="'Fira Code','SFMono-Regular',Consolas,monospace" font-size="12" fill="#64748b">TypeScript React</text>

    <!-- greeting -->
    <text x="500" y="112" text-anchor="middle" font-family="'Fira Code','SFMono-Regular',Consolas,monospace" font-size="16" fill="#22d3ee" letter-spacing="3">&lt;Hello World /&gt;  I AM</text>

    <!-- NAME -->
    <text x="500" y="188" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" fill="url(#txt)" filter="url(#glow)">Sudipto Kumar Chakrabarty</text>

    <!-- divider -->
    <rect x="410" y="212" width="180" height="3" rx="2" fill="url(#txt)"/>

    <!-- title -->
    <text x="500" y="252" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600" fill="#e2e8f0" letter-spacing="1">Frontend-Focused Software Developer</text>
    <text x="500" y="284" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#94a3b8">Building modern, responsive and user-friendly web experiences</text>

    <!-- tech chips -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      <rect x="236" y="315" width="120" height="34" rx="17" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.6"><animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="3s" repeatCount="indefinite"/></rect>
      <text x="296" y="337" fill="#7dd3fc">React.js</text>
      <rect x="372" y="315" width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#e2e8f0" stroke-opacity="0.5"><animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="0.5s" repeatCount="indefinite"/></rect>
      <text x="432" y="337" fill="#f1f5f9">Next.js</text>
      <rect x="508" y="315" width="120" height="34" rx="17" fill="#3b82f6" fill-opacity="0.14" stroke="#60a5fa" stroke-opacity="0.6"><animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="3s" begin="1s" repeatCount="indefinite"/></rect>
      <text x="568" y="337" fill="#93c5fd">TypeScript</text>
      <rect x="644" y="315" width="120" height="34" rx="17" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.6"><animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect>
      <text x="704" y="337" fill="#fde047">JavaScript</text>
    </g>

    <!-- light sweep -->
    <rect x="-300" y="0" width="300" height="400" fill="url(#sweep)">
      <animate attributeName="x" values="-300;1000" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
